<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer contraseña · ASTRO SISTEMAS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="login-container">

        <div class="login-header">
            <div class="login-logo">
                <i class="ti ti-lock-check"></i>
            </div>
            <h1>ASTRO SISTEMAS</h1>
            <p>Crea tu nueva contraseña</p>
        </div>

        <div class="login-box">
            <div class="error-message" id="errorMessage">
                <i class="ti ti-alert-circle"></i>
                <span id="errorText"></span>
            </div>

            <div class="success-message" id="successMessage">
                <i class="ti ti-circle-check"></i>
                <span id="successText"></span>
            </div>

            <form id="resetForm">
                <div class="form-group">
                    <label for="newPassword">
                        <i class="ti ti-lock"></i>Nueva contraseña
                    </label>
                    <div class="input-wrapper">
                        <input type="password" id="newPassword" name="newPassword" required
                            minlength="8" placeholder="Mínimo 8 caracteres" autocomplete="off">
                        <button type="button" class="toggle-password" id="toggleNewPassword" aria-label="Mostrar contraseña">
                            <i class="ti ti-eye" id="toggleNewIcon"></i>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">
                        <i class="ti ti-lock-check"></i>Confirmar contraseña
                    </label>
                    <div class="input-wrapper">
                        <input type="password" id="confirmPassword" name="confirmPassword" required
                            minlength="8" placeholder="Repite la contraseña" autocomplete="off">
                        <button type="button" class="toggle-password" id="toggleConfirmPassword" aria-label="Mostrar contraseña">
                            <i class="ti ti-eye" id="toggleConfirmIcon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="login-btn" id="submitBtn">
                    <i class="ti ti-device-floppy"></i>Guardar nueva contraseña
                </button>
            </form>

            <a href="login.html" class="back-to-login">
                <i class="ti ti-arrow-left"></i> Volver al inicio de sesión
            </a>
        </div>

        <div class="login-footer">
            <i class="ti ti-shield-lock"></i>
            Conexión segura · ASTRO SISTEMAS © 2026
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/reset-password.js"></script>

</body>
</html>
