<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración de Grupos - ASTRO SISTEMAS</title>
    <link rel="stylesheet" href="css/vendor/inter/inter.css?v=fase8-2">
    <link rel="stylesheet" href="css/vendor/tabler/tabler-icons.min.css?v=fase8-2">
    <link rel="stylesheet" href="css/global.css?v=fase8-2">
    <link rel="stylesheet" href="css/layout.css?v=fase8-2">
    <link rel="stylesheet" href="css/administracion.css?v=fase8-2">
</head>
<body>
<div class="admin-container">

    <div id="sidebarRoot"></div>

    <main class="admin-main" id="adminMain">

        <div class="admin-header">
            <div class="admin-header-left">
                <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
                    <i class="ti ti-menu-2" aria-hidden="true"></i>
                </button>
                <div>
                    <h1>Administración de Grupos</h1>
                    <p>Gestiona los grupos del sistema de acceso</p>
                </div>
            </div>
        </div>

        <!-- Busqueda y filtros -->
        <div class="search-bar">
            <div class="search-wrap">
                <i class="ti ti-search" aria-hidden="true"></i>
                <input type="text" id="searchInput" aria-label="Buscar por código o nombre" placeholder="Buscar por código o nombre..." oninput="filterTable()" autocomplete="off">
            </div>
            <div class="filter-sep"></div>
            <div class="filter-select">
                <label for="filterEstatus">Estatus</label>
                <select id="filterEstatus" onchange="filterTable()">
                    <option value="">Todos</option>
                    <option value="Activo">Activo</option>
                    <option value="Inactivo">Inactivo</option>
                </select>
            </div>
        </div>

        <!-- Tabla -->
        <div class="table-section">
            <div class="table-header">
                <div>
                    <h2>Grupos Registrados</h2>
                    <span><strong id="visibleCount">0</strong> grupos encontrados</span>
                </div>
                <div class="table-actions">
                    <button class="btn-export" onclick="exportTable('groupsTable','csv')">
                        <i class="ti ti-file-type-csv" aria-hidden="true"></i>CSV
                    </button>
                    <button class="btn-export" onclick="exportTable('groupsTable','xlsx')">
                        <i class="ti ti-file-spreadsheet" aria-hidden="true"></i>Excel
                    </button>
                </div>
            </div>

            <div class="table-wrapper">
                <table id="groupsTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Código</th>
                            <th>Nombre</th>
                            <th>Estatus</th>
                            <th class="col-actions">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="groupsTableBody">
                        <!-- Se llena desde loadGroups() -->
                    </tbody>
                </table>
                <div class="no-results" id="noResults" style="display:none">
                    <i class="ti ti-search-off" aria-hidden="true"></i>
                    No se encontraron grupos con ese criterio
                </div>
                <div class="loading-state" id="loadingState" role="status">
                    <i class="ti ti-loader-2" aria-hidden="true"></i>
                    Cargando grupos...
                </div>
                <div class="table-state is-error" id="groupsError" role="alert" hidden>
                    <i class="ti ti-cloud-off" aria-hidden="true"></i>
                    <span class="table-state-title">No se pudieron cargar los grupos</span>
                    <span>Revisa tu conexión e inténtalo de nuevo.</span>
                    <button type="button" class="btn-secondary" onclick="loadGroups()">
                        <i class="ti ti-refresh" aria-hidden="true"></i> Reintentar
                    </button>
                </div>
            </div>

            <div class="pagination">
                <button id="prevBtn" onclick="previousPage()" disabled>
                    <i class="ti ti-chevron-left" aria-hidden="true"></i> Anterior
                </button>
                <span id="pageInfo" aria-live="polite">Página 1 de 1</span>
                <button id="nextBtn" onclick="nextPage()" disabled>
                    Siguiente <i class="ti ti-chevron-right" aria-hidden="true"></i>
                </button>
            </div>
        </div>

    </main>
</div>

<script src="js/api.js?v=fase8-2"></script>
<script src="js/auth.js?v=fase8-2"></script>
<script src="js/ui.js?v=fase8-2"></script>
<script src="js/navbar.js?v=fase8-2"></script>
<script src="js/administracion-grupos.js?v=fase8-2"></script>
</body>
</html>
