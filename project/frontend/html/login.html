<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login · ASTRO SISTEMAS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="login-container">

        <div class="login-header">
            <div class="login-logo">
                <i class="ti ti-building-skyscraper"></i>
            </div>
            <h1>ASTRO SISTEMAS</h1>
            <p>Ingresa tus credenciales para continuar</p>
        </div>

        <div class="login-box">
            <form id="loginForm">
                <div class="error-message" id="errorMessage">
                    <i class="ti ti-alert-circle"></i>
                    <span id="errorText"></span>
                </div>

                <div class="form-group">
                    <label for="username">
                        <i class="ti ti-user"></i>Usuario
                    </label>
                    <div class="input-wrapper">
                        <input type="text" id="username" name="username" required
                            placeholder="Ingresa tu usuario" autocomplete="off">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">
                        <i class="ti ti-lock"></i>Contraseña
                    </label>
                    <div class="input-wrapper">
                        <input type="password" id="password" name="password" required
                            placeholder="Ingresa tu contraseña" autocomplete="off">
                        <button type="button" class="toggle-password" id="togglePassword" aria-label="Mostrar contraseña">
                            <i class="ti ti-eye" id="toggleIcon"></i>
                        </button>
                    </div>
                    <a href="forgot-password.html" class="forgot-link">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit" class="login-btn" id="loginBtn">
                    <i class="ti ti-login"></i>Ingresar
                </button>
            </form>
        </div>

        <div class="login-footer">
            <i class="ti ti-shield-lock"></i>
            Conexión segura · ASTRO SISTEMAS © 2026
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/login.js"></script>

</body>
</html>
