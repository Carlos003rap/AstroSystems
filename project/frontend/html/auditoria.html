<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auditoría - ASTRO SISTEMAS</title>
    <link rel="stylesheet" href="css/vendor/inter/inter.css?v=fase8">
    <link rel="stylesheet" href="css/vendor/tabler/tabler-icons.min.css?v=fase8">
    <link rel="stylesheet" href="css/global.css?v=fase8">
    <link rel="stylesheet" href="css/layout.css?v=fase8">
    <link rel="stylesheet" href="css/administracion.css?v=fase8">
    <link rel="stylesheet" href="css/auditoria.css?v=fase8">
</head>
<body>
<div class="admin-container">

    <div id="sidebarRoot"></div>

    <main class="admin-main" id="adminMain">

        <div class="admin-header">
            <div class="admin-header-left">
                <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
                    <i class="ti ti-menu-2" aria-hidden="true"></i>
                </button>
                <div>
                    <h1>Auditoría del Sistema</h1>
                    <p>Registro de accesos y cambios realizados por los administradores</p>
                </div>
            </div>
        </div>

        <!-- Tabs -->
        <div class="aud-tabs" role="tablist" aria-label="Tipo de auditoría">
            <button class="aud-tab" id="tabLogin" role="tab" aria-selected="false" aria-controls="audTable" onclick="setTab('login',this)">
                <i class="ti ti-login" aria-hidden="true"></i>Auditoría de Login
            </button>
            <button class="aud-tab" id="tabCambios" role="tab" aria-selected="false" aria-controls="audTable" onclick="setTab('cambios',this)">
                <i class="ti ti-git-commit" aria-hidden="true"></i>Auditoría de Cambios
            </button>
        </div>

        <!-- Stats -->
        <div class="aud-stats" id="statsRow" aria-live="polite">
            <div class="aud-stat is-skeleton"></div>
            <div class="aud-stat is-skeleton"></div>
            <div class="aud-stat is-skeleton"></div>
            <div class="aud-stat is-skeleton"></div>
        </div>

        <!-- Filtros -->
        <div class="aud-filters">
            <div class="aud-ff grow">
                <label for="searchInput">Buscar</label>
                <div class="search-wrap">
                    <i class="ti ti-search" aria-hidden="true"></i>
                    <input type="text" id="searchInput"
                        placeholder="Buscar por administrador..."
                        oninput="filterTable()"
                        autocomplete="off"
                        title="Buscar registros"
                        aria-label="Buscar registros">
                </div>
            </div>
            <div class="aud-ff" id="filterResWrap">
                <label for="filterRes">Resultado</label>
                <select id="filterRes" onchange="filterTable()"
                    aria-label="Filtrar por resultado"
                    title="Filtrar por resultado">
                    <option value="">Todos</option>
                    <option value="Exitoso">Exitoso</option>
                    <option value="Fallido">Fallido</option>
                    <option value="Bloqueado">Bloqueado</option>
                </select>
            </div>
            <div class="aud-ff" id="filterTablaWrap" style="display:none">
                <label for="filterTabla">Tabla</label>
                <select id="filterTabla" onchange="filterTable()"
                    aria-label="Filtrar por tabla"
                    title="Filtrar por tabla">
                    <option value="">Todas</option>
                    <option value="usuario">usuario</option>
                    <option value="grupo">grupo</option>
                    <option value="acceso_grupo">acceso_grupo</option>
                    <option value="puerta">puerta</option>
                    <option value="area">area</option>
                </select>
            </div>
            <div class="aud-ff">
                <label for="filterDesde">Fecha desde</label>
                <input type="date" id="filterDesde" onchange="filterTable()"
                    title="Fecha desde" aria-label="Fecha desde">
            </div>
            <div class="aud-ff">
                <label for="filterHasta">Fecha hasta</label>
                <input type="date" id="filterHasta" onchange="filterTable()"
                    title="Fecha hasta" aria-label="Fecha hasta">
            </div>
        </div>

        <!-- Tabla -->
        <div class="aud-table-card">
            <div class="aud-table-top">
                <div>
                    <h3 id="tableTitle">Registro de Login</h3>
                    <p id="tableCount" class="aud-count">0 registros encontrados</p>
                </div>
                <div class="export-btns">
                    <button class="btn-export" onclick="exportTable('audTable','csv')">
                        <i class="ti ti-file-type-csv" aria-hidden="true"></i>CSV
                    </button>
                    <button class="btn-export" onclick="exportTable('audTable','xlsx')">
                        <i class="ti ti-file-spreadsheet" aria-hidden="true"></i>Excel
                    </button>
                </div>
            </div>
            <div class="table-wrapper">
                <table id="audTable">
                    <thead id="tHead"></thead>
                    <tbody id="tBody"></tbody>
                </table>
                <div class="no-results" id="emptyState" style="display:none">
                    <i class="ti ti-search-off" aria-hidden="true"></i>
                    Sin registros encontrados
                </div>
                <div class="table-state is-error" id="auditError" role="alert" hidden>
                    <i class="ti ti-cloud-off" aria-hidden="true"></i>
                    <span class="table-state-title">No se pudo cargar la auditoría</span>
                    <span>Revisa tu conexión e inténtalo de nuevo.</span>
                    <button type="button" class="btn-secondary" onclick="cargarDatos(currentTab)">
                        <i class="ti ti-refresh" aria-hidden="true"></i> Reintentar
                    </button>
                </div>
            </div>
        </div>

    </main>
</div>

<script src="js/api.js?v=fase8"></script>
<script src="js/auth.js?v=fase8"></script>
<script src="js/ui.js?v=fase8"></script>
<script src="js/navbar.js?v=fase8"></script>
<script>
var currentTab = 'login';
var DATA = { login: [], cambios: [] };
var AUD_ERROR = false; // la carga falló: se muestra el estado de error en lugar de "sin registros"

var STATS = {
    login: function() {
        var ex     = DATA.login.filter(function(r){return r.resultado==='Exitoso';}).length;
        var fa     = DATA.login.filter(function(r){return r.resultado==='Fallido' || r.resultado==='Bloqueado';}).length;
        var admins = [...new Set(DATA.login.map(function(r){return r.idAdmin;}))].length;
        return [
            {ico:'ti-login',       cls:'si-blue',  label:'Total accesos',  val:DATA.login.length},
            {ico:'ti-circle-check',cls:'si-green', label:'Exitosos',       val:ex},
            {ico:'ti-circle-x',    cls:'si-red',   label:'Fallidos',       val:fa},
            {ico:'ti-user-shield', cls:'si-amber', label:'Admins activos', val:admins}
        ];
    },
    cambios: function() {
        var tablas = [...new Set(DATA.cambios.map(function(r){return r.tablaAfectada;}))].length;
        var admins = [...new Set(DATA.cambios.map(function(r){return r.idAdmin;}))].length;
        var dias   = [...new Set(DATA.cambios.map(function(r){return r.fecha;}))].length;
        return [
            {ico:'ti-history',   cls:'si-amber', label:'Total cambios',    val:DATA.cambios.length},
            {ico:'ti-table',     cls:'si-blue',  label:'Tablas afectadas', val:tablas},
            {ico:'ti-user-edit', cls:'si-green', label:'Administradores',  val:admins},
            {ico:'ti-calendar',  cls:'si-red',   label:'Días con cambios', val:dias}
        ];
    }
};

function setTab(tab, btn) {
    currentTab = tab;
    document.querySelectorAll('.aud-tab').forEach(function(b){ b.classList.remove('active'); });
    if (btn) btn.classList.add('active');
    document.querySelectorAll('.aud-tab').forEach(function(b){ b.setAttribute('aria-selected', b.classList.contains('active') ? 'true' : 'false'); });
    history.replaceState(null, '', window.location.pathname + '?tab=' + tab);
    document.getElementById('filterResWrap').style.display   = tab==='login'   ? '' : 'none';
    document.getElementById('filterTablaWrap').style.display = tab==='cambios' ? '' : 'none';
    document.getElementById('searchInput').value = '';
    document.getElementById('filterRes').value   = '';
    document.getElementById('filterDesde').value = '';
    document.getElementById('filterHasta').value = '';
    document.getElementById('searchInput').placeholder = tab==='login'
        ? 'Buscar por administrador...'
        : 'Buscar por tabla, campo o admin...';
    document.getElementById('tableTitle').textContent = tab==='login' ? 'Registro de Login' : 'Historial de Cambios';
    renderStats();
    renderTable();
}

function renderStats() {
    var stats = STATS[currentTab]();
    document.getElementById('statsRow').innerHTML = stats.map(function(s) {
        return '<div class="aud-stat">' +
            '<div class="aud-stat-ico ' + s.cls + '"><i class="ti ' + s.ico + '" aria-hidden="true"></i></div>' +
            '<div class="aud-stat-info"><span>' + s.label + '</span><strong data-count="' + s.val + '">' + s.val + '</strong></div>' +
        '</div>';
    }).join('');
    // Contador animado (respeta "reducir movimiento")
    document.querySelectorAll('#statsRow [data-count]').forEach(function(el) {
        UIService.countUp(el, Number(el.getAttribute('data-count')), 700);
    });
}

function renderTable() {
    var data = DATA[currentTab];
    var s = document.getElementById('searchInput').value.toLowerCase().trim();
    var d = document.getElementById('filterDesde').value;
    var h = document.getElementById('filterHasta').value;
    var r = currentTab==='login'
        ? document.getElementById('filterRes').value
        : document.getElementById('filterTabla').value;

    var filtered = data.filter(function(row) {
        var str = (row.admin + ' ' + (row.resultado||'') + ' ' + (row.tablaAfectada||'') + ' ' + (row.campoEditado||'')).toLowerCase();
        var matchS = !s || str.includes(s);
        var matchR = !r || (currentTab==='login' ? row.resultado===r : row.tablaAfectada===r);
        var matchD = !d || row.fecha >= d;
        var matchH = !h || row.fecha <= h;
        return matchS && matchR && matchD && matchH;
    });

    // Mostrar primero lo más reciente (fecha y hora descendente; a igual momento, el ID mayor)
    filtered.sort(function(a, b) {
        var ta = (a.fecha || '') + ' ' + (a.hora || '');
        var tb = (b.fecha || '') + ' ' + (b.hora || '');
        if (ta !== tb) return ta < tb ? 1 : -1;
        return (b.id || 0) - (a.id || 0);
    });

    document.getElementById('tableCount').textContent = filtered.length + ' registros encontrados';
    document.getElementById('emptyState').style.display = (filtered.length || AUD_ERROR) ? 'none' : 'block';

    if (currentTab === 'login') {
        document.getElementById('tHead').innerHTML =
            '<tr><th>ID</th><th>Administrador</th><th>Fecha</th><th>Hora</th><th>Resultado</th></tr>';
        document.getElementById('tBody').innerHTML = filtered.map(function(r) {
            var cls = r.resultado==='Exitoso' ? 'aud-pill-ok'     : (r.resultado==='Bloqueado' ? 'aud-pill-warn' : 'aud-pill-fail');
            var ico = r.resultado==='Exitoso' ? 'ti-circle-check' : (r.resultado==='Bloqueado' ? 'ti-lock' : 'ti-circle-x');
            return '<tr>' +
                '<td><span class="aud-id">#' + String(r.id).padStart(3,'0') + '</span></td>' +
                '<td><span class="aud-admin-tag">' + (r.admin||'—') + '</span></td>' +
                '<td>' + r.fecha + '</td>' +
                '<td><span class="aud-time">' + r.hora + '</span></td>' +
                '<td><span class="aud-pill ' + cls + '"><i class="ti ' + ico + '" aria-hidden="true"></i>' + r.resultado + '</span></td>' +
            '</tr>';
        }).join('');
    } else {
        document.getElementById('tHead').innerHTML =
            '<tr><th>ID</th><th>Administrador</th><th>Tabla</th><th>Campo</th><th>Valor anterior</th><th>Valor nuevo</th><th>Fecha</th><th>Hora</th></tr>';
        document.getElementById('tBody').innerHTML = filtered.map(function(r) {
            return '<tr>' +
                '<td><span class="aud-id">#' + String(r.id).padStart(3,'0') + '</span></td>' +
                '<td><span class="aud-admin-tag">' + (r.admin||'—') + '</span></td>' +
                '<td><span class="aud-tabla-tag">' + (r.tablaAfectada||'—') + '</span></td>' +
                '<td><strong>' + (r.campoEditado||'—') + '</strong></td>' +
                '<td><span class="aud-val-old" title="' + String(r.valorAnterior||'—').replace(/"/g,'&quot;') + '">' + (r.valorAnterior||'—') + '</span></td>' +
                '<td><span class="aud-val-new" title="' + String(r.valorNuevo||'—').replace(/"/g,'&quot;') + '">' + (r.valorNuevo||'—') + '</span></td>' +
                '<td>' + r.fecha + '</td>' +
                '<td><span class="aud-time">' + r.hora + '</span></td>' +
            '</tr>';
        }).join('');
    }
}

function filterTable() { renderTable(); }

// ── Cargar datos desde la API ──
function cargarDatos(tab) {
    // Esqueleto mientras llegan los datos
    AUD_ERROR = false;
    document.getElementById('auditError').hidden = true;
    document.getElementById('emptyState').style.display = 'none';
    if (!document.getElementById('tHead').children.length) {
        document.getElementById('tHead').innerHTML = '<tr><th>ID</th><th>Administrador</th><th>Fecha</th><th>Hora</th><th>Resultado</th></tr>';
    }
    UIService.renderSkeletonRows(document.getElementById('tBody'), 5, 6);

    Promise.all([
        apiClient.getLoginLogs(0, 100),
        apiClient.getAuditLogs(0, 100)
    ]).then(function(results) {
        var loginLogs = results[0].content || results[0];
        var auditLogs = results[1].content || results[1];

        DATA.login = loginLogs.map(function(l) {
            var fechaCompleta = l.fecha || '';
            var partes = fechaCompleta.split('T');
            return {
                id:        l.idAuditoriaLogin,
                idAdmin:   l.admin ? l.admin.id : null,
                admin:     l.admin ? l.admin.username : '—',
                fecha:     partes[0] || '',
                hora:      partes[1] ? partes[1].substring(0,8) : '',
                resultado: l.resultado
            };
        });

        DATA.cambios = auditLogs.map(function(l) {
            var fechaCompleta = l.fecha || '';
            var partes = fechaCompleta.split('T');
            return {
                id:            l.idAuditoriaEdicion,
                idAdmin:       l.admin ? l.admin.id : null,
                admin:         l.admin ? l.admin.username : '—',
                tablaAfectada: l.tablaAfectada,
                campoEditado:  l.campoEditado,
                valorAnterior: l.valorAnterior,
                valorNuevo:    l.valorNuevo,
                fecha:         partes[0] || '',
                hora:          partes[1] ? partes[1].substring(0,8) : ''
            };
        });

        setTab(tab, document.getElementById(tab==='login' ? 'tabLogin' : 'tabCambios'));

    }).catch(function(e) {
        console.error('Error cargando auditoria:', e);
        UIService.showError('Error al cargar auditoría');
        AUD_ERROR = true;
        setTab(tab, document.getElementById(tab==='login' ? 'tabLogin' : 'tabCambios'));
        document.getElementById('auditError').hidden = false;
    });
}

window.addEventListener('load', function() {
    var params = new URLSearchParams(window.location.search);
    var tab = params.get('tab') || 'login';
    cargarDatos(tab);
});
</script>
</body>
</html>
