<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olvidé mi contraseña · ASTRO SISTEMAS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="login-container">

        <div class="login-header">
            <div class="login-logo">
                <i class="ti ti-key"></i>
            </div>
            <h1>ASTRO SISTEMAS</h1>
            <p>Recupera el acceso a tu cuenta</p>
        </div>

        <div class="login-box">
            <form id="forgotForm">
                <div class="error-message" id="errorMessage">
                    <i class="ti ti-alert-circle"></i>
                    <span id="errorText"></span>
                </div>

                <div class="success-message" id="successMessage">
                    <i class="ti ti-mail-check"></i>
                    <span id="successText"></span>
                </div>

                <div class="form-group">
                    <label for="email">
                        <i class="ti ti-mail"></i>Correo electrónico
                    </label>
                    <div class="input-wrapper">
                        <input type="email" id="email" name="email" required
                            placeholder="Ingresa tu correo registrado" autocomplete="off">
                    </div>
                </div>

                <button type="submit" class="login-btn" id="submitBtn">
                    <i class="ti ti-send"></i>Enviar enlace de recuperación
                </button>
            </form>

            <a href="login.html" class="back-to-login">
                <i class="ti ti-arrow-left"></i> Volver al inicio de sesión
            </a>
        </div>

        <div class="login-footer">
            <i class="ti ti-shield-lock"></i>
            Conexión segura · ASTRO SISTEMAS © 2026
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/forgot-password.js"></script>

</body>
</html>
